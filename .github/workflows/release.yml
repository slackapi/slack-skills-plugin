name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Don't let two release runs race on the same branch.
concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  PY_VERSION: "3.14"
  NODE_VERSION: "26"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install Node dependencies
        run: npm install
      - name: Changesets release
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          commit-message: "chore: release"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-draft: create
          pr-title: "chore: release"
          publish-script: npx changeset publish
          version-script: bash scripts/changeset_version.sh
      - name: Get publication details
        id: release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          echo "url=$(gh release view --json url -q .url)" >> "$GITHUB_OUTPUT"
          echo "message=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | "\(.name)@\(.version)"' | paste -sd ', ' -)" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_RELEASE_ANNOUNCEMENTS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            action_url: "${{ steps.release.outputs.url }}"
            message: "${{ steps.release.outputs.message }}"
            repository: "${{ github.repository }}"
